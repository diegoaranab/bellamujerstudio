<div class="public-shell" data-testid="public-shell">
  <header class="public-header" aria-label="Bella Mujer Studio">
    <a class="public-brand" routerLink="/">
      <div class="logo" aria-hidden="true">BM</div>
      <div>
        <p class="brand-name">Bella Mujer Studio</p>
        <p class="brand-subtitle">Tehuacán, Puebla</p>
      </div>
    </a>
    <nav class="public-nav" aria-label="Navegación pública" data-testid="public-nav">
      <a
        routerLink="/"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-home-link"
      >
        Inicio
      </a>
      <a
        routerLink="/servicios"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-services-link"
      >
        Servicios
      </a>
      <a
        routerLink="/galeria"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-gallery-link"
      >
        Galería
      </a>
      <a
        routerLink="/contacto"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-contact-link"
      >
        Contacto
      </a>
      <a
        routerLink="/tarjeta-regalo"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-gift-card-link"
      >
        Tarjeta de regalo
      </a>
      <a
        class="public-nav__whatsapp"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener"
        data-testid="public-nav-whatsapp-link"
      >
        WhatsApp
      </a>
    </nav>
  </header>

  <main class="public-content">
    <router-outlet />
  </main>
</div>
