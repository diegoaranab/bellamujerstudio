<div class="public-shell" data-testid="public-shell">
  <button class="skip-link" type="button" data-testid="public-skip-link" (click)="skipToMain()">
    Saltar al contenido
  </button>
  <header class="public-header" aria-label="Bella Mujer Studio">
    <a class="public-brand" routerLink="/" (click)="closeMenuForNavigation(homeUrl)">
      <div class="logo" aria-hidden="true" data-testid="public-brand-utility-mark">BM</div>
      <div class="public-brand__copy">
        <p class="brand-name">Bella Mujer Studio</p>
        <p class="brand-subtitle">Tehuacán, Puebla</p>
      </div>
    </a>
    <div class="public-header__actions">
      <a
        class="public-mobile-whatsapp"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir WhatsApp para agendar"
        data-testid="public-mobile-whatsapp-link"
      >
        WhatsApp
      </a>
      <button
        class="public-menu-toggle"
        type="button"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="public-nav"
        [attr.aria-label]="isMenuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
        data-testid="public-menu-toggle"
        (click)="toggleMenu()"
      >
        <span aria-hidden="true">{{ isMenuOpen() ? 'Cerrar' : 'Menú' }}</span>
      </button>
    </div>
    <nav
      id="public-nav"
      class="public-nav"
      [class.public-nav--open]="isMenuOpen()"
      aria-label="Navegación pública"
      data-testid="public-nav"
      (keydown.escape)="closeMenu(true)"
    >
      <a
        routerLink="/"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'ignored'
        }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-home-link"
        (click)="closeMenuForNavigation(homeUrl)"
      >
        Inicio
      </a>
      <a
        routerLink="/servicios"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'ignored'
        }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-services-link"
        (click)="closeMenuForNavigation(servicesUrl)"
      >
        Servicios
      </a>
      <a
        routerLink="/galeria"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'ignored'
        }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-gallery-link"
        (click)="closeMenuForNavigation(galleryUrl)"
      >
        Galería
      </a>
      <a
        routerLink="/contacto"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'ignored'
        }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-contact-link"
        (click)="closeMenuForNavigation(contactUrl)"
      >
        Contacto
      </a>
      <a
        routerLink="/tarjeta-regalo"
        routerLinkActive="public-nav__link--active"
        [routerLinkActiveOptions]="{
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'ignored'
        }"
        ariaCurrentWhenActive="page"
        data-testid="public-nav-gift-card-link"
        (click)="closeMenuForNavigation(giftCardUrl)"
      >
        Tarjeta de regalo
      </a>
      <a
        class="public-nav__whatsapp"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        data-testid="public-nav-whatsapp-link"
      >
        WhatsApp
      </a>
    </nav>
  </header>

  <main id="public-main" class="public-content" data-navigation-focus-main tabindex="-1">
    <router-outlet />
  </main>
</div>
