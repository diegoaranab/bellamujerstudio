<div class="app-shell" data-testid="admin-shell">
  <aside class="sidenav">
    <div class="sidenav-header">
      <div class="logo">BM</div>
      <div>
        <p class="brand-name">Bella Mujer Studio</p>
        <p class="brand-subtitle">Tehuacán, Puebla</p>
      </div>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.path === '/admin/inicio' }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </aside>

  <div class="main-frame">
    <mat-toolbar class="topbar">
      <div class="topbar-text">
        <span class="page-title">Panel Bella Mujer</span>
        <span class="page-subtitle">Operación diaria del estudio</span>
      </div>
      <span class="spacer"></span>
      <button mat-icon-button aria-label="Buscar">
        <mat-icon>search</mat-icon>
      </button>
      <button mat-icon-button aria-label="Notificaciones">
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-flat-button color="primary" (click)="openNuevaCita()">
        Nueva cita
      </button>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Navegación móvil">
    @for (item of navItems; track item.path) {
      <a
        class="bottom-nav__item"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/admin/inicio' }"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
