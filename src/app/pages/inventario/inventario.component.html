<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Control</p>
      <h1>Inventario</h1>
      <p class="subtitle">Productos, consumibles y alertas de reposición.</p>
    </div>
    <button class="ghost-chip" type="button">+ Registrar entrada</button>
  </header>

  <section class="cards">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Materiales disponibles</mat-card-title>
        <mat-card-subtitle>Control de existencias</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <mat-list class="dense-list">
          <mat-list-item
            *ngFor="let material of (inventario$ | async)?.materials"
          >
            <div class="list-row">
              <div class="list-main">
                <p class="name">{{ material.nombre }}</p>
                <p class="detail">
                  Stock actual: {{ material.stockActual }}
                  {{ material.unidad }}
                </p>
                <p class="detail">
                  Mínimo sugerido: {{ material.stockMinimo }}
                  {{ material.unidad }}
                </p>
              </div>
              <mat-chip
                *ngIf="material.stockActual <= material.stockMinimo"
                color="warn"
              >
                Stock bajo
              </mat-chip>
            </div>
          </mat-list-item>
        </mat-list>
      </mat-card-content>
    </mat-card>
  </section>
</section>
