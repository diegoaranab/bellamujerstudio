<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Control</p>
      <h1>Inventario</h1>
      <p class="subtitle">Productos, consumibles y alertas de reposición.</p>
    </div>
    <button class="ghost-chip" type="button" (click)="openRegistrarEntrada()">
      + Registrar entrada
    </button>
  </header>

  <section class="cards">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Materiales disponibles</mat-card-title>
        <mat-card-subtitle>Control de existencias</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="bm-data-list">
          <div
            class="bm-data-row"
            *ngFor="let material of (inventario$ | async)?.materials"
          >
            <div class="bm-data-main">
              <div class="bm-data-title">{{ material.nombre }}</div>
              <div class="bm-data-subtitle">
                Stock actual: {{ material.stockActual }} {{ material.unidad }}
              </div>
            </div>
            <div class="bm-data-meta">
              <mat-chip
                *ngIf="material.stockMinimo > 0 && material.stockActual <= material.stockMinimo"
                color="warn"
                selected
              >
                Stock bajo
              </mat-chip>
            </div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </section>
</section>
