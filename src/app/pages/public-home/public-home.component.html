<section class="public-home" data-testid="public-home-page">
  <div class="public-home__content">
    <p class="eyebrow">Bella Mujer Studio</p>
    <h1>Estamos preparando nuestro sitio público.</h1>
    <p class="intro">
      Pronto encontrarás aquí servicios, galería e información para agendar tu visita.
      Mientras tanto, puedes contactarnos por WhatsApp.
    </p>
    <a
      mat-flat-button
      color="primary"
      class="contact-link"
      [href]="whatsappUrl"
      target="_blank"
      rel="noopener"
      data-testid="public-home-whatsapp-link"
    >
      <mat-icon>chat</mat-icon>
      Contactar por WhatsApp
    </a>
  </div>
</section>
