<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Catálogo</p>
      <h1>Servicios</h1>
      <p class="subtitle">Define paquetes, precios y duración de cada servicio.</p>
    </div>
    <button class="ghost-chip" type="button">+ Agregar servicio</button>
  </header>

  <section class="cards">
    <mat-card *ngFor="let categoria of categorias$ | async">
      <mat-card-header>
        <mat-card-title>{{ categoria.nombre }}</mat-card-title>
        <mat-card-subtitle>
          {{ categoria.servicios.length }} servicios activos
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <mat-list class="dense-list">
          <mat-list-item *ngFor="let servicio of categoria.servicios">
            <div class="list-row">
              <div>
                <p class="name">{{ servicio.nombre }}</p>
                <p class="detail">{{ servicio.descripcionCorta }}</p>
              </div>
              <p class="amount">
                {{ servicio.precioBaseMXN | currency: 'MXN' }} ·
                {{ servicio.duracionMinBase }} min
              </p>
            </div>
          </mat-list-item>
        </mat-list>
      </mat-card-content>
    </mat-card>
  </section>
</section>
