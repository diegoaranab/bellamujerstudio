<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Relaciones</p>
      <h1>Clientes</h1>
      <p class="subtitle">Historial de visitas, preferencias y recordatorios.</p>
    </div>
    <button class="ghost-chip" type="button">+ Nuevo cliente</button>
  </header>

  <section class="cards">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Clientes registrados</mat-card-title>
        <mat-card-subtitle>Contactos principales</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <mat-list class="dense-list">
          <mat-list-item *ngFor="let cliente of (clientes$ | async)?.clients">
            <div class="list-row">
              <p class="name">{{ cliente.nombre }}</p>
              <p class="detail">{{ cliente.telefono }}</p>
            </div>
          </mat-list-item>
        </mat-list>
      </mat-card-content>
    </mat-card>
  </section>
</section>
