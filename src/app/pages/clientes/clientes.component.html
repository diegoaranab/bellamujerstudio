<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Relaciones</p>
      <h1>Clientes</h1>
      <p class="subtitle">Historial de visitas, preferencias y recordatorios.</p>
    </div>
    <button class="ghost-chip" type="button">+ Nuevo cliente</button>
  </header>

  <section class="cards">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Clientes registrados</mat-card-title>
        <mat-card-subtitle>Contactos principales</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="bm-data-list">
          <div
            class="bm-data-row"
            *ngFor="let cliente of (clientes$ | async)?.clients"
          >
            <div class="bm-data-main">
              <div class="bm-data-title">{{ cliente.nombre }}</div>
            </div>
            <div class="bm-data-meta">
              <div class="duration">{{ cliente.telefono }}</div>
            </div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </section>
</section>
