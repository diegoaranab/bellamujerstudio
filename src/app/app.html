<div class="app-shell">
  <mat-sidenav-container class="shell-container">
    <mat-sidenav class="sidenav" mode="side" opened>
      <div class="sidenav-header">
        <div class="logo">BM</div>
        <div>
          <p class="brand-name">Bella Mujer Studio</p>
          <p class="brand-subtitle">Tehuacán, Puebla</p>
        </div>
      </div>
      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar class="topbar">
        <div class="topbar-text">
          <span class="page-title">Panel Bella Mujer</span>
          <span class="page-subtitle">Operación diaria del estudio</span>
        </div>
        <span class="spacer"></span>
        <button mat-icon-button aria-label="Buscar">
          <mat-icon>search</mat-icon>
        </button>
        <button mat-icon-button aria-label="Notificaciones">
          <mat-icon>notifications</mat-icon>
        </button>
        <button mat-flat-button color="primary">Nueva cita</button>
      </mat-toolbar>

      <main class="content">
        <router-outlet />
      </main>

      <nav class="bottom-nav" aria-label="Navegación móvil">
        @for (item of navItems; track item.path) {
          <a class="bottom-nav__item" [routerLink]="item.path" routerLinkActive="active">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
